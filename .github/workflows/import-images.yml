name: Import images from current site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/images.json', 'scripts/fetch-images.mjs']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/fetch-images.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images brand-source
          git diff --cached --quiet || (git commit -m "Import photos from lasheidaspa.com" && git push)
