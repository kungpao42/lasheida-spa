name: Deploy @ID page to S3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['stacks/dist/**']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: slstacks
      SLUG: lasheidaspa
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS secrets
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "AWS secrets not set; skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Sync to s3://slstacks/lasheidaspa/
        if: steps.creds.outputs.ok == 'true'
        run: |
          aws s3 sync "stacks/dist/$SLUG/" "s3://$BUCKET/$SLUG/" --delete --cache-control "max-age=3600"
          echo "Live: https://$BUCKET.s3.amazonaws.com/$SLUG/id.html"
